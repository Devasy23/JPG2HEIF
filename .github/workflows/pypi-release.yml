name: Publish Python 🐍 distributions 📦 to PyPI

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  extract-tag:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.extract_tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: extract_tag
        name: Extract tag name
        run: |
          TAG=$(echo $GITHUB_REF | cut -d / -f 3)
          echo "tag=$TAG" >> $GITHUB_ENV

  build-and-publish-test-pypi:
    needs: extract-tag
    runs-on: ubuntu-latest
    environment:
      name: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.9
        uses: actions/setup-python@v3
        with:
          python-version: "3.9"
      - name: Install dependencies
        run: python3 -m pip install setuptools wheel twine semver packaging bump2version
      - name: Get Current Version and Bump
        id: bump_version
        run: |
          CURRENT_VERSION=$(python3 setup.py --version)
          NEW_VERSION=$(bump2version --dry-run --list patch | grep new_version= | sed -r s,"^.*=",,)
          echo "new_version=$NEW_VERSION" >> $GITHUB_ENV
      - name: Bump version
        run: |
          bump2version patch --new-version ${{ env.new_version }} --allow-dirty
      - name: Update package metadata
        run: |
          sed -i 's/version="[^"]*"/version="${{ env.new_version }}"/' setup.py
          sed -i 's/version = "[^"]*"/version = "${{ env.new_version }}"/' pyproject.toml
      - name: Build a binary wheel
        run: python3 setup.py sdist bdist_wheel
      - name: Publish distribution 📦 to test-PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          password: ${{ secrets.TEST_PYPI_API_TOKEN }}

  build-and-publish-pypi:
    needs: build-and-publish-test-pypi
    runs-on: ubuntu-latest
    environment:
      name: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.9
        uses: actions/setup-python@v3
        with:
          python-version: "3.9"
      - name: Install dependencies
        run: python3 -m pip install setuptools wheel twine bump2version
      - name: Bump version
        run: |
          bump2version patch --new-version ${{ env.tag }} --allow-dirty
      - name: Update package metadata
        run: |
          sed -i 's/version="[^"]*"/version="${{ env.tag }}"/' setup.py
          sed -i 's/version = "[^"]*"/version = "${{ env.tag }}"/' pyproject.toml
      - name: Build a binary wheel
        run: python3 setup.py sdist bdist_wheel
      - name: Publish distribution 📦 to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
          attestations: false
